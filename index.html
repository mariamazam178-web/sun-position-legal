<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sun Position — Legal</title>
  <style>
    :root {
      --bg: #faf6ef;
      --card: #ffffff;
      --text: #1b1c1e;
      --muted: #5a5f73;
      --accent: #f5a623;
      --line: #e8e2d4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 4px;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 28px;
    }
    a.card {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 14px;
      text-decoration: none;
      color: var(--text);
    }
    a.card:hover { border-color: var(--accent); }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .card-desc {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Sun Position</h1>
    <p class="sub">Sun, moon and Milky Way planning tools — all calculations on your device.</p>

    <a class="card" href="privacy-policy.html">
      <p class="card-title">Privacy Policy</p>
      <p class="card-desc">No accounts, no tracking, no analytics — your data never leaves your device.</p>
    </a>

    <a class="card" href="terms-and-conditions.html">
      <p class="card-title">Terms &amp; Conditions</p>
      <p class="card-desc">Informational use only, no warranty, and how the app may be used.</p>
    </a>
  </div>
</body>
</html>
